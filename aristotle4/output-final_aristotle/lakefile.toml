name = "RequestProject"
defaultTargets = ["RequestProject", "tm_mixed_radix_result", "tm_overflow_progress"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "tm_mixed_radix_result"
globs = ["tm_mixed_radix_result.+"]

[[lean_lib]]
name = "tm_overflow_progress"
globs = ["tm_overflow_progress.+"]

[[lean_lib]]
name = "Accel"
globs = ["Accel.+"]
